# Temporary, branch-scoped remediation workflow; remove after reviewing results.
name: Refresh vulnerable frontend lockfile
on:
  push:
    branches:
      - fix/ci-security-2026-10

permissions:
  contents: write

jobs:
  safe-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply non-breaking npm audit fixes
        working-directory: frontend
        run: |
          npm audit fix --package-lock-only --no-fund || true
          npm ci --no-audit --no-fund
          npm run lint
          npm run type-check
          npm run test
          npm run build
      - name: Commit validated lockfile changes to this branch
        run: |
          if ! git diff --quiet -- frontend/package-lock.json frontend/package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json frontend/package.json
            git commit -m "fix(deps): refresh non-breaking frontend dependency patches"
            git push origin HEAD:refs/heads/fix/ci-security-2026-10
          fi
