name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check .
      - name: Mypy type check
        run: mypy app --ignore-missing-imports

  backend-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          SUPABASE_URL: http://localhost
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          SUPABASE_JWT_SECRET: test-secret-32-chars-long-enough!!
          DEEPL_API_KEY: test
          ELEVENLABS_API_KEY: test
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_test
          STRIPE_STARTER_PRICE_ID: price_starter
          STRIPE_PRO_PRICE_ID: price_pro
          STRIPE_ENTERPRISE_PRICE_ID: price_enterprise
          RESEND_API_KEY: test
          FROM_EMAIL: test@example.com
          REDIS_URL: redis://localhost:6379/0
          DEBUG: "true"
          ALLOWED_ORIGINS: "http://localhost:5173"

  frontend-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  frontend-type-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run type-check

  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-key
          VITE_API_URL: http://localhost:8000
          VITE_SENTRY_DSN: ""
          VITE_POSTHOG_KEY: ""
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_dummy

  frontend-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t orange-backend ./backend
      - name: Build frontend image
        run: docker build -t orange-frontend ./frontend

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend security audit
        working-directory: frontend
        run: npm audit --audit-level=high || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend security audit
        working-directory: backend
        run: |
          pip install pip-audit -e "."
          pip-audit || true
